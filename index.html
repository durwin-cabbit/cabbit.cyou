<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>cabbit.cyou</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background:
        radial-gradient(circle at center, #2a0016 0%, #12000a 45%, #000 100%);
      color: white;
      font-family: Arial, Helvetica, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .main {
      text-align: center;
      padding: 24px;
    }

    .image {
      width: 180px;
      height: 180px;
      margin: 0 auto 28px;
      border-radius: 18px;
      background: #16000c;
      border: 1px solid #ff4fa3;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #ff8fc4;
      font-size: 13px;
      overflow: hidden;
    }

    .image img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    h1 {
      margin: 0;
      font-size: 52px;
      font-weight: 700;
      letter-spacing: -2px;
    }

    p {
      margin: 12px 0 0;
      color: #ff73b7;
      font-size: 18px;
      text-transform: lowercase;
    }

    @media (max-width: 600px) {
      h1 {
        font-size: 40px;
      }

      .image {
        width: 150px;
        height: 150px;
      }
    }
  </style>
</head>

<body>
  <main class="main">
    <div class="image">
     
      <img src="cabbit.png" alt="cabbit">
   
    </div>

    <h1>cabbit.club</h1>
    <p>get good get cabbit</p>
  </main>
</body>
</html>
